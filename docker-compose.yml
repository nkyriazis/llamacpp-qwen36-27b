services:
  llama-cpp:
    build:
      context: .
      dockerfile: llama-cpp.Dockerfile
      args:
        LLAMA_CPP_REF: ${LLAMA_CPP_REF:-master}
        CUDA_ARCH: ${LLAMA_CUDA_ARCH:-120a}
    image: llamacpp-qwen:${LLAMA_CPP_REF:-master}
    runtime: nvidia
    ipc: host
    ports:
      - "8080:8080"
    environment:
      # Prompt-cache tuning for the hybrid (recurrent) model; see README.
      LLAMA_ARG_CTX_CHECKPOINTS: ${LLAMA_CTX_CHECKPOINTS:-32}
      LLAMA_ARG_CHECKPOINT_MIN_SPACING_NT: ${LLAMA_CHECKPOINT_MIN_STEP:-8192}
      # One KV pool shared by all slots (each slot may use up to the full context).
      LLAMA_ARG_KV_UNIFIED: ${LLAMA_KV_UNIFIED:-1}
      LLAMA_ARG_LOG_VERBOSITY: ${LLAMA_LOG_VERBOSITY:-3}
    volumes:
      - ./models:/models:ro
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --model
      - ${LLAMA_MODEL:?set LLAMA_MODEL in .env}
      - --mmproj
      - ${LLAMA_MMPROJ:?set LLAMA_MMPROJ in .env}
      - --alias
      - ${LLAMA_ALIAS:-qwen3.8-27b}
      - -ngl
      - all
      - --fit
      - "off"
      - --parallel
      - ${LLAMA_PARALLEL:-1}
      - --ctx-size
      - ${LLAMA_CTX_SIZE:-262144}
      - --batch-size
      - ${LLAMA_BATCH:-2048}
      - --ubatch-size
      - ${LLAMA_UBATCH:-512}
      - --jinja
      - --flash-attn
      - "on"
      - --cache-type-k
      - ${LLAMA_CACHE_TYPE_K:-q8_0}
      - --cache-type-v
      - ${LLAMA_CACHE_TYPE_V:-q4_0}
      - --cache-ram
      - ${LLAMA_CACHE_RAM:-32768}
      # Speculative decoding via the MTP head embedded in the GGUF.
      # ~2x decode per stream; measured unchanged with 3 slots.
      - --spec-type
      - ${LLAMA_SPEC_TYPE:-draft-mtp}
      - --spec-draft-n-max
      - ${LLAMA_SPEC_DRAFT_N_MAX:-3}
      - --reasoning
      - ${LLAMA_REASONING:-on}
      - --reasoning-effort
      - ${LLAMA_REASONING_EFFORT:-medium}
      - --reasoning-budget
      - ${LLAMA_REASONING_BUDGET:-16384}
      - --reasoning-budget-message
      - ${LLAMA_REASONING_BUDGET_MESSAGE:-Considering the limited time, I have to give the solution based on the thinking directly now.}
      # Default sampling (clients may override per request). Qwen-recommended values:
      #   thinking:     temp 1.0, top-p 0.95, top-k 20, min-p 0, presence 0
      #   non-thinking: temp 0.7, top-p 0.80, top-k 20, min-p 0, presence 1.5
      - --temp
      - ${LLAMA_TEMP:-1.0}
      - --top-p
      - ${LLAMA_TOP_P:-0.95}
      - --top-k
      - ${LLAMA_TOP_K:-20}
      - --min-p
      - ${LLAMA_MIN_P:-0.0}
      - --presence-penalty
      - ${LLAMA_PRESENCE_PENALTY:-0.0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # Routes Claude Code traffic: the served model (LLAMA_ALIAS) to llama.cpp, everything else to
  # api.anthropic.com untouched. Used by claude-code/claude-qwen; see claude-code/README.md.
  claude-router:
    image: python:3.13-slim
    command: [ "python3", "/app/router.py" ]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      ROUTER_HOST: 0.0.0.0
      ROUTER_PORT: "8098"
      LOCAL_UPSTREAM: http://llama-cpp:8080
      LOCAL_MODEL: ${LLAMA_ALIAS:-qwen3.8-27b}
      ROUTER_LOG: /state/router.jsonl
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./claude-code/router.py:/app/router.py:ro
      - ./claude-code/.state:/state
    ports:
      - "127.0.0.1:8098:8098"
    depends_on:
      - llama-cpp
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8098/router/health', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 3
